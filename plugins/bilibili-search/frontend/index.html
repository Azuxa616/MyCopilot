<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src https: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>bilibili-search 卡片渲染器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }
  body { font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 2px; }
  @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }
  .card {
    display: flex; flex-direction: column; overflow: hidden;
    border: 1px solid #e5e7eb; border-radius: 12px; background: #fff;
    text-decoration: none; color: inherit;
    transition: border-color .15s, box-shadow .15s;
  }
  .card:hover { border-color: #a5b4fc; box-shadow: 0 4px 12px rgba(0,0,0,.08); }
  .cover { position: relative; width: 100%; aspect-ratio: 16/9; background: #f3f4f6; }
  .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .duration {
    position: absolute; right: 6px; bottom: 6px; padding: 2px 6px;
    border-radius: 4px; background: rgba(0,0,0,.7); color: #fff;
    font: 11px/1.2 ui-monospace, monospace;
  }
  .play-overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0); transition: background .15s;
  }
  .card:hover .play-overlay { background: rgba(0,0,0,.3); }
  .play-overlay span {
    width: 34px; height: 34px; border-radius: 50%; background: rgba(0,0,0,.6);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .15s;
  }
  .card:hover .play-overlay span { opacity: 1; }
  .play-overlay svg { width: 15px; height: 15px; fill: #fff; margin-left: 2px; }
  .meta { display: flex; flex-direction: column; gap: 4px; padding: 10px; flex: 1; }
  .title {
    font-size: 13px; font-weight: 500; line-height: 1.4; color: #1f2937;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .stats { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #9ca3af; overflow: hidden; }
  .stats .author { max-width: 45%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stats .stat { flex-shrink: 0; display: inline-flex; align-items: center; gap: 3px; }
  .stats svg { width: 12px; height: 12px; fill: none; stroke: #9ca3af; stroke-width: 2; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script>
(function () {
  'use strict';

  var requestId = null;

  function post(msg) {
    msg.requestId = requestId;
    // 沙箱 null origin：只能向 parent 广播，宿主按 requestId + contentWindow 过滤
    window.parent.postMessage(msg, '*');
  }

  function reportHeight() {
    post({ type: 'rendered', height: Math.ceil(document.documentElement.scrollHeight) });
  }

  /** 数字短格式：431000 → 43.1万 */
  function fmtCount(n) {
    return (typeof n === 'number' && n >= 10000)
      ? (n / 10000).toFixed(1) + '万'
      : String(n ?? 0);
  }

  var EYE_SVG = '<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  var DANMAKU_SVG = '<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';
  var PLAY_SVG = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';

  function el(tag, className, html) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (html !== undefined) node.innerHTML = html;
    return node;
  }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function buildCard(card) {
    var a = el('a', 'card');
    a.href = esc(card.url || '');
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    // sandbox 无 allow-popups：点击经宿主代为打开（仅 https 放行）
    a.addEventListener('click', function (e) {
      e.preventDefault();
      post({ type: 'open', url: card.url });
    });

    var cover = el('div', 'cover');
    var img = document.createElement('img');
    img.alt = esc(card.title || '');
    img.loading = 'lazy';
    img.referrerPolicy = 'no-referrer';
    img.src = esc(card.cover || '');
    img.addEventListener('load', reportHeight);   // 封面加载后重报高度
    img.addEventListener('error', reportHeight);
    cover.appendChild(img);
    if (card.duration) cover.appendChild(el('span', 'duration', esc(card.duration)));
    var overlay = el('div', 'play-overlay', '<span>' + PLAY_SVG + '</span>');
    cover.appendChild(overlay);
    a.appendChild(cover);

    var meta = el('div', 'meta');
    meta.appendChild(el('span', 'title', esc(card.title || '')));
    var stats = el('div', 'stats');
    stats.appendChild(el('span', 'author', esc(card.author || '')));
    stats.appendChild(el('span', 'stat', EYE_SVG + esc(fmtCount(card.play))));
    stats.appendChild(el('span', 'stat', DANMAKU_SVG + esc(fmtCount(card.danmaku))));
    meta.appendChild(stats);
    a.appendChild(meta);
    return a;
  }

  function render(payload) {
    var grid = document.getElementById('grid');
    grid.innerHTML = '';
    var cards = [];
    try {
      var parsed = JSON.parse(payload);
      cards = Array.isArray(parsed) ? parsed : (parsed && parsed.cards) || [];
    } catch (e) {
      post({ type: 'error', message: '载荷 JSON 解析失败' });
      return;
    }
    if (!cards.length) {
      post({ type: 'error', message: '卡片列表为空' });
      return;
    }
    cards.slice(0, 12).forEach(function (card) {
      if (card && typeof card.url === 'string' && card.url.indexOf('https://') === 0) {
        grid.appendChild(buildCard(card));
      }
    });
    // 首次高度上报（图片加载完成后还会再报）
    requestAnimationFrame(reportHeight);
  }

  window.addEventListener('message', function (event) {
    var data = event.data;
    if (!data || typeof data !== 'object') return;
    if (data.type === 'render' && typeof data.payload === 'string') {
      requestId = data.requestId;
      render(data.payload);
    }
  });

  // 兜底：字体就绪等引起的布局变化后再补报一次
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(reportHeight);
  }
})();
</script>
</body>
</html>
