# CI：PR 与 push 快速门禁 — lint / typecheck / test
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -r run lint

      - name: Build shared (生成 dist 类型，server/web typecheck 依赖)
        run: pnpm --filter @my-copilot/shared build

      - name: Typecheck
        run: pnpm -r run tsc --noEmit

      - name: Test
        run: pnpm -r run test

      - name: Build
        run: pnpm -r run build
