name: mycopilot
services:
  mycopilot:
    # 自用实例（泳道 personal）：仅绑定 127.0.0.1:3000，公网不可达（外出访问走 Tailscale/SSH 隧道）。
    # 镜像默认从 GHCR 拉取（CI 构建推送）；IMAGE 未设置时回退为本地构建（首次部署/离线场景）。
    image: ${IMAGE:-ghcr.io/azuxa616/my-copilot:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    pull_policy: ${PULL_POLICY:-missing}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - AUTH_TOKEN=${AUTH_TOKEN:?set in docker/.env.personal}
      - DATA_DIR=/app/data
      - PORT=3000
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - MAX_ATTACHMENT_SIZE_MB=${MAX_ATTACHMENT_SIZE_MB:-10}
      - SERVER_PUBLIC_DIR=/app/apps/web/dist
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
